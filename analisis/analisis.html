    <!-- Fungsi untuk mendapatkan GET (Data dari URL) -->
    <script>

        function someFunctionBtnAnHour(){
            location.replace('../analisis?page=an_hour').then(location.reload());
        }

        function someFunctionBtnToday(){
            location.replace('../analisis?page=today').then(location.reload());
        }

        function someFunctionBtnThisMonth(){
            location.replace('../analisis?page=this_month').then(location.reload());
        }

        function getUrlVars(param = null) {
            if (param !== null) {
                var vars = [], hash;
                var hashes = window.location.href.slice(window.location.href.indexOf('?') + 1).split('&');
                for (var i = 0; i < hashes.length; i++) {
                    hash = hashes[i].split('=');
                    vars.push(hash[0]);
                    vars[hash[0]] = hash[1];
                }
                return vars[param];
            }
            else {
                return null;
            }
        }
    </script>
