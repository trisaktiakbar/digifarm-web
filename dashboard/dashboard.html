<body>

    <script>

        if (sessionStorage.getItem('user_uid') == null) {
            window.location = "../login"
        }
    </script>

    <!-- Library Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

    <div class="row m-3" style="overflow: auto;">

        <div class="col-lg-4">
            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Level Ketinggian Air</strong></div>
                <div class="card-body">
                    <h1 class="card-title text-success mt-4 text-value" id="value-water-level"></h1>
                    <h3 class="card-text text-success mb-4" id="status-water-level"></h3>
                    <button type="button" class="btn bg-digifarm text-light px-5" style="float: right;"
                        onclick="watering()"><strong>Siram</strong></button>
                </div>
            </div>
            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Kelembaban Udara</strong></div>
                <div class="card-body">
                    <h1 class="card-title text-success mt-4 text-value" id="value-humidity"></h1>
                    <h3 class="card-text text-success mb-4" id="status-humidity"></h3>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Kelembaban Tanah</strong></div>
                <div class="card-body">
                    <h1 class="card-title text-success mt-4 text-value" id="value-soil-moisture"></h1>
                    <h3 class="card-text text-success mb-4" id="status-soil-moisture"></h3>
                </div>
            </div>

            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Cuaca</strong></div>
                <div class="card-body">
                    <h1 class="card-title text-success mt-4 text-value">
                        <center>
                            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor"
                                class="bi bi-brightness-high" viewBox="0 0 16 16" id="icon-weather">
                            </svg>
                        </center>
                    </h1>
                    <h3 class="card-text text-success mb-4" id="status-weather"></h3>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Suhu</strong></div>
                <div class="card-body">
                    <h1 class="card-title text-success mt-4 text-value" id="value-temperature"></h1>
                    <h3 class="card-text text-success mb-4" id="status-temperature"></h3>
                </div>
            </div>

            <div class="card text-white mb-3 shadow border-success" style="max-width: 150rem;">
                <div class="card-header bg-digifarm text-light"><strong>Analisis & Detail</strong></div>
                <div class="card-body">
                    <center>
                        <h1 class="card-title text-success mt-4 text-value">

                            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor"
                                class="bi bi-clipboard2-data-fill" viewBox="0 0 16 16">
                                <path
                                    d="M10 .5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5.5.5 0 0 1-.5.5.5.5 0 0 0-.5.5V2a.5.5 0 0 0 .5.5h5A.5.5 0 0 0 11 2v-.5a.5.5 0 0 0-.5-.5.5.5 0 0 1-.5-.5Z" />
                                <path
                                    d="M4.085 1H3.5A1.5 1.5 0 0 0 2 2.5v12A1.5 1.5 0 0 0 3.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 12.5 1h-.585c.055.156.085.325.085.5V2a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 4 2v-.5c0-.175.03-.344.085-.5ZM10 7a1 1 0 1 1 2 0v5a1 1 0 1 1-2 0V7Zm-6 4a1 1 0 1 1 2 0v1a1 1 0 1 1-2 0v-1Zm4-3a1 1 0 0 1 1 1v3a1 1 0 1 1-2 0V9a1 1 0 0 1 1-1Z" />
                            </svg>

                        </h1>
                        <h5 class="card-text text-success mb-4 mt-4">Mulai analisis pertumbuhan tanaman anda</h5>
                    </center>
                </div>
            </div>
        </div>

    </div>

    <script>
        var status_water_level, status_soil_moisture, status_weather, status_humidity, status_temperature;
        var value_water_level = document.getElementById("value-water-level");
        var value_soil_moisture = document.getElementById("value-soil-moisture");
        var value_weather = document.getElementById("value-weather");
        var value_humidity = document.getElementById("value-humidity");
        var value_temperature = document.getElementById("value-temperature");
        var icon_weather = document.getElementById("icon-weather");
        var status_weather = document.getElementById("status-weather");
        var value_light, value_raindrops, cuaca;

        var firebaseRef = firebase.database().ref("Current Data");
        firebaseRef.on("value", function (snapshot) {
            var data = snapshot.val();
            value_water_level.innerHTML = "<center>" + data["Level Ketinggian Air"] + "%<center>";
            value_soil_moisture.innerHTML = "<center>" + data["Kelembaban Tanah"] + "%<center>";
            value_humidity.innerHTML = "<center>" + data["Kelembaban Udara"] + "%<center>";
            value_temperature.innerHTML = "<center>" + data["Suhu"] + "°C<center>";

            value_light = data["Cahaya"];
            value_raindrops = data["Hujan"];

            if (data["Level Ketinggian Air"] < 30) {
                status_water_level = "Tersisa sedikit";
            }
            else if (data["Level Ketinggian Air"] >= 30 && data["Level Ketinggian Air"] <= 50) {
                status_water_level = "Cukup banyak";
            }
            else if (data["Level Ketinggian Air"] > 50 && data["Level Ketinggian Air"] <= 75) {
                status_water_level = "Lumayan banyak";
            }
            else if (data["Level Ketinggian Air"] > 75) {
                status_water_level = "Banyak";
            }

            if (data["Kelembaban Tanah"] < 20) {
                status_soil_moisture = "Kering";
            }
            else if (data["Kelembaban Tanah"] >= 20 && data["Kelembaban Tanah"] <= 40) {
                status_soil_moisture = "Cukup Kering";
            }
            else if (data["Kelembaban Tanah"] > 40 && data["Kelembaban Tanah"] <= 70) {
                status_soil_moisture = "Normal";
            }
            else if (data["Kelembaban Tanah"] > 70) {
                status_soil_moisture = "Lembab";
            }

            if (data["Kelembaban Udara"] < 20) {
                status_humidity = "Kering";
            }
            else if (data["Kelembaban Udara"] >= 20 && data["Kelembaban Udara"] <= 40) {
                status_humidity = "Cukup Kering";
            }
            else if (data["Kelembaban Udara"] > 40 && data["Kelembaban Udara"] <= 70) {
                status_humidity = "Normal";
            }
            else if (data["Kelembaban Udara"] > 70) {
                status_humidity = "Lembab";
            }

            if (data["Suhu"] < 26) {
                status_temperature = "Dingin";
            }
            else if (data["Suhu"] >= 26 && data["Suhu"] <= 34) {
                status_temperature = "Normal";
            }
            else if (data["Suhu"] > 34) {
                status_temperature = "Panas";
            }

            document.getElementById("status-water-level").innerHTML = "<center><strong>" + status_water_level + "</center></strong>";
            document.getElementById("status-soil-moisture").innerHTML = "<center><strong>" + status_soil_moisture + "</center></strong>";
            document.getElementById("status-humidity").innerHTML = "<center><strong>" + status_humidity + "</center></strong>";
            document.getElementById("status-temperature").innerHTML = "<center><strong>" + status_temperature + "</center></strong>";

            if (value_light < 100) {
                cuaca = "Cerah Berawan";
                icon_weather.innerHTML = '<path d="M7 8a3.5 3.5 0 0 1 3.5 3.555.5.5 0 0 0 .624.492A1.503 1.503 0 0 1 13 13.5a1.5 1.5 0 0 1-1.5 1.5H3a2 2 0 1 1 .1-3.998.5.5 0 0 0 .51-.375A3.502 3.502 0 0 1 7 8zm4.473 3a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5h-.027z"/><path d="M10.5 1.5a.5.5 0 0 0-1 0v1a.5.5 0 0 0 1 0v-1zm3.743 1.964a.5.5 0 1 0-.707-.707l-.708.707a.5.5 0 0 0 .708.708l.707-.708zm-7.779-.707a.5.5 0 0 0-.707.707l.707.708a.5.5 0 1 0 .708-.708l-.708-.707zm1.734 3.374a2 2 0 1 1 3.296 2.198c.199.281.372.582.516.898a3 3 0 1 0-4.84-3.225c.352.011.696.055 1.028.129zm4.484 4.074c.6.215 1.125.59 1.522 1.072a.5.5 0 0 0 .039-.742l-.707-.707a.5.5 0 0 0-.854.377zM14.5 6.5a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1h-1z"/>';
            }
            else if (value_light >= 100) {
                cuaca = "Cerah";
                icon_weather.innerHTML = '<path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>';
            }
            if (value_raindrops > 20 && value_raindrops <= 50) {
                cuaca = "Hujan Ringan";
                icon_weather.innerHTML = '<path d="M4.158 12.025a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317zm6 0a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317zm-3.5 1.5a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 0 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317zm6 0a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317zm.747-8.498a5.001 5.001 0 0 0-9.499-1.004A3.5 3.5 0 1 0 3.5 11H13a3 3 0 0 0 .405-5.973zM8.5 2a4 4 0 0 1 3.976 3.555.5.5 0 0 0 .5.445H13a2 2 0 0 1 0 4H3.5a2.5 2.5 0 1 1 .605-4.926.5.5 0 0 0 .596-.329A4.002 4.002 0 0 1 8.5 2z"/>'
            }
            else if (value_raindrops > 50) {
                cuaca = "Hujan"
                icon_weather.innerHTML = '<path d="M13.405 4.527a5.001 5.001 0 0 0-9.499-1.004A3.5 3.5 0 1 0 3.5 10.5H13a3 3 0 0 0 .405-5.973zM8.5 1.5a4 4 0 0 1 3.976 3.555.5.5 0 0 0 .5.445H13a2 2 0 0 1-.001 4H3.5a2.5 2.5 0 1 1 .605-4.926.5.5 0 0 0 .596-.329A4.002 4.002 0 0 1 8.5 1.5zM3.75 15.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm.408-3.724a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316zM7.75 15.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm.408-3.724a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316zm3.592 3.724a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm.408-3.724a.5.5 0 0 1 .316.632l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.316z"/>';
            }

            status_weather.innerHTML = "<center><strong>" + cuaca + "</strong><center>";


        });

    </script>

    <!-- Session  -->
    <script>
        var db_siram_ref = firebase.database().ref()

        function watering() {
            // Send data
            var user_data = {
                "Water Pump": "On"
            }

            db_siram_ref.child('Current Data').update(user_data)
        }

        var uid = sessionStorage.getItem("user_uid");

        var nama_user = document.getElementById("nama_user")

        var firebaseRef = firebase.database().ref("User");

        firebaseRef.child(uid).once("value", function (snapshot) {
            var data = snapshot.val();
            var nama_depan = data["Nama Depan"];
            var nama_belakang = data["Nama Belakang"];

            nama_user.innerHTML = "&ensp;" + nama_depan + " " + nama_belakang;
        })


    </script>



</body>
